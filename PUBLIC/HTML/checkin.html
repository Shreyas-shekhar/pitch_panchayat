<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pitch Panchayat Check-In</title>

    <link 
        rel="stylesheet" 
        href="checkin.css"
    >

</head>


<body>

<div class="container">

    <h1>Pitch Panchayat</h1>

    <h2>Participant Check-In</h2>


    <!-- CAMERA CONTROLS -->

    <div class="scanner-controls">

        <button id="scanBtn">

            📷 Start Scanner

        </button>


        <select id="cameraSelect">

            <option value="">

                Loading cameras...

            </option>

        </select>


        <button 
            id="switchCameraBtn"
            style="display:none;"
        >

            🔄 Switch Camera

        </button>


        <button 
            id="stopScannerBtn"
            style="display:none;"
        >

            ⛔ Stop Scanner

        </button>

    </div>


    <!-- QR CAMERA -->

    <div id="reader"></div>


    <!-- STATUS -->

    <p id="scannerStatus">

        Ready to scan

    </p>


    <!-- PARTICIPANT RESULT -->

    <div 
        id="resultCard" 
        class="hidden"
    >

        <div id="participantInfo"></div>

    </div>


</div>


<!-- QR SCANNER LIBRARY -->

<script src="https://unpkg.com/html5-qrcode"></script>


<!-- YOUR FIREBASE SCANNER JS -->

<script 
    type="module" 
    src="checkin.js"
></script>


</body>

</html>
