    <section class="register-section">

    <div class="register-card">
        <span class="section-tag">
            REGISTER NOW
        </span>

        <h2>
            Secure your seat at
            <span>Pitch Panchayat.</span>
        </h2>

        <p>
            Present your startup idea, receive expert feedback,
            connect with innovators, and compete for exciting prizes.
        </p>

          <form class="register-form" id="registrationForm">


           
</select>

            <input type="text"
                   placeholder="full Name"
                   id="fullName"
                   required>

            <input type="email"
                   placeholder="Email Address"
                   id="email"
                   required>

            <input type="tel"
                   placeholder="Phone Number"
                   id="phone"
                   required>

            <input type="text"
                   placeholder="College / Organization"
                   id="college"
                   required>

             <select id="age" required>
                    <option value="">Select Age Group</option>
                    <option>14-16 Years</option>
                    <option>17-19 Years</option>
                    <option>20-22 Years</option>
                    <option>23+ Years</option>
             </select>

              <select id="category" required>
                <option value="">
                    Select Category
                </option>

                <option>
                    Technology
                </option>

                <option>
                    Healthcare
                </option>

                <option>
                    Education
                </option>

                <option>
                    Sustainability
                </option>

                <option>
                    Other
                </option>
            </select>

            <textarea id="idea" Describe your startup idea in a few lines rows="5">
            </textarea>

            
      

           

    <p class="team-subtitle">
        Enter your team information and details of all participants.
    </p>

    <!-- Team Name -->
    <div class="form-group">
        <input
            type="text"
            id="teamName"
            name="teamName"
            placeholder="Enter your team name"
            required
        >
    </div>

    <!-- Participant 1 -->

                name="participant1Name"
                placeholder="Enter full name"
                required
            >
        </div>

        <div class="form-group">
            <input
                type="tel"
                id="participant1Phone"
                name="participant1Phone"
                placeholder="Enter phone number"
